<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seiyuu Studio</title>
  <style>
    :root { color-scheme: light; --paper:#f5f3ee; --ink:#252722; --muted:#676b63; --rule:#cbc9bf; --accent:#743b45; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
    a { color:inherit; text-underline-offset:3px; }
    button,select,textarea,input { font:inherit; color:inherit; }
    button,select,input,textarea { border:1px solid var(--rule); background:#fffdf9; border-radius:0; }
    button { cursor:pointer; padding:9px 16px; }
    button:hover { border-color:var(--accent); color:var(--accent); }
    button:disabled { opacity:.45; cursor:default; }
    button.primary { background:var(--ink); border-color:var(--ink); color:var(--paper); }
    button.primary:hover { background:var(--accent); border-color:var(--accent); }
    :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    header { border-bottom:1px solid var(--rule); padding:22px clamp(20px,4vw,64px); display:flex; align-items:baseline; justify-content:space-between; gap:24px; }
    h1,h2,h3,p { margin:0; }
    h1 { font:normal 35px/1.2 Georgia,serif; letter-spacing:.02em; }
    h2 { font:normal 26px/1.3 Georgia,serif; }
    h3 { font-size:14px; font-weight:600; }
    .eyebrow { color:var(--accent); font:11px/1.4 Consolas,monospace; letter-spacing:.14em; text-transform:uppercase; }
    main { max-width:1500px; margin:auto; padding:38px clamp(20px,4vw,64px) 80px; display:grid; grid-template-columns:minmax(230px,.28fr) minmax(0,1fr); gap:clamp(28px,5vw,80px); }
    aside { border-top:1px solid var(--ink); padding-top:19px; }
    aside dl { margin:22px 0; }
    aside dl div { display:flex; justify-content:space-between; border-bottom:1px solid var(--rule); padding:10px 0; gap:12px; }
    aside dt { color:var(--muted); }
    aside dd { margin:0; font-family:Consolas,monospace; }
    aside p { color:var(--muted); font-size:12px; }
    .content { min-width:0; }
    section { border-top:1px solid var(--ink); padding-top:18px; margin-bottom:65px; }
    .section-head { display:flex; justify-content:space-between; align-items:baseline; gap:20px; margin-bottom:24px; }
    .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:13px; }
    select { min-height:42px; padding:8px 12px; max-width:100%; }
    #collection { min-width:160px; }
    #entry { min-width:280px; flex:1; }
    textarea { display:block; width:100%; min-height:450px; resize:vertical; padding:18px; font:12px/1.55 Consolas,monospace; tab-size:2; }
    .editor-actions { display:flex; align-items:center; gap:18px; margin-top:15px; }
    .editor-actions small { color:var(--muted); }
    .reviewer { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
    .reviewer label { display:flex; flex-direction:column; gap:5px; color:var(--muted); font-size:12px; flex:1; min-width:180px; }
    .reviewer input { min-height:42px; padding:8px 12px; color:var(--ink); }
    .review-list { border-top:1px solid var(--rule); }
    .review-row { display:grid; grid-template-columns:minmax(0,1fr) 120px auto; gap:15px; align-items:center; border-bottom:1px solid var(--rule); padding:13px 0; }
    .review-row p,.source-row p { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
    .status { font:11px Consolas,monospace; color:var(--accent); }
    .source-row { display:grid; grid-template-columns:minmax(0,1fr) 110px auto; gap:15px; align-items:start; border-bottom:1px solid var(--rule); padding:15px 0; }
    .source-row a { overflow-wrap:anywhere; }
    .source-actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    .source-actions button { padding:6px 9px; font-size:12px; }
    details { margin-top:8px; color:var(--muted); font-size:12px; }
    details summary { cursor:pointer; }
    .notice { min-height:27px; margin:9px 0 19px; white-space:pre-wrap; color:var(--accent); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:850px) { main { display:block; } aside { margin-bottom:45px; } .source-row,.review-row { grid-template-columns:minmax(0,1fr) auto; } .status { grid-column:1/-1; grid-row:2; } }
    @media(max-width:520px) { header { display:block; } header a { display:inline-block; margin-top:12px; } .source-row,.review-row { display:block; } .source-actions { justify-content:flex-start; margin-top:9px; } .status { display:block; margin:7px 0; } }
  </style>
  <script defer src="/studio.js"></script>
</head>
<body>
  <header>
    <div><span class="eyebrow">Local editorial workspace</span><h1>Seiyuu Studio</h1></div>
    <a href="http://127.0.0.1:3000/zh-CN" target="_blank" rel="noreferrer">预览站点 ↗</a>
  </header>
  <main>
    <aside>
      <span class="eyebrow">Overview</span>
      <dl id="overview"></dl>
      <p>保存会校验整份档案，并在 content/.revisions 留下前一版。站点内容更新后重新构建。</p>
    </aside>
    <div class="content">
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
      <section>
        <div class="section-head"><div><span class="eyebrow">01 / Content</span><h2>档案编辑</h2></div></div>
        <div class="controls"><label><span class="sr-only">集合</span><select id="collection"></select></label><label><span class="sr-only">条目</span><select id="entry"></select></label></div>
        <textarea id="editor" spellcheck="false" aria-label="档案 JSON"></textarea>
        <div class="editor-actions"><button id="save" class="primary">保存档案</button><small>JSON · 来源与关联校验</small></div>
      </section>
      <section>
        <div class="section-head"><div><span class="eyebrow">02 / Language</span><h2>人工三语审校</h2></div></div>
        <div class="reviewer"><label>审核人<input id="reviewer" autocomplete="name"></label><label>审核说明<input id="review-note"></label></div>
        <div id="locale-reviews" class="review-list"></div>
      </section>
      <section>
        <div class="section-head"><div><span class="eyebrow">03 / Provenance</span><h2>来源版本审核</h2></div></div>
        <div id="source-reviews" class="review-list"></div>
      </section>
    </div>
  </main>
</body>
</html>
